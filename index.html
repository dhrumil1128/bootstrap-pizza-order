<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cart-item-row { display: flex; align-items: center; margin-bottom: 10px; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Pizza Ordering System</h1>
        
        <div class="row">
            <div class="col-md-8">
                <h2>Menu</h2>
                <div id="menu-list" class="list-group">
                    <!-- Menu items will be rendered here -->
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        Pizza Margherita ($10.00)
                        <button class="btn btn-sm btn-primary" onclick="addToCart('Margherita', 10.00)">Add to Cart</button>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        Veggie Supreme ($15.50)
                        <button class="btn btn-sm btn-primary" onclick="addToCart('Supreme', 15.50)">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <h2>Cart</h2>
                <div id="cart-items">
                    <!-- Cart items will be rendered here -->
                    <p id="empty-cart-message">Your cart is empty.</p>
                </div>
                <hr>
                <h4>Total: $<span id="cart-total">0.00</span></h4>
                <button class="btn btn-success mt-3 w-100" onclick="placeOrder()">Place Order</button>
                <div id="status-message" class="mt-2"></div>
            </div>
        </div>
    </div>

    <script>
        let cart = {};

        function renderCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const totalSpan = document.getElementById('cart-total');
            let total = 0;
            cartItemsDiv.innerHTML = '';

            if (Object.keys(cart).length === 0) {
                document.getElementById('empty-cart-message').style.display = 'block';
            } else {
                document.getElementById('empty-cart-message').style.display = 'none';
            }

            for (const name in cart) {
                const item = cart[name];
                total += item.price * item.quantity;
                
                const div = document.createElement('div');
                div.className = 'cart-item-row mb-2 p-2 border rounded';
                div.innerHTML = `
                    <div>
                        <strong>${name}</strong> (x${item.quantity})<br>
                        <small>$${item.price.toFixed(2)} ea.</small>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary mx-1" onclick="updateQuantity('${name}', -1)">-</button>
                        <button class="btn btn-sm btn-outline-secondary mx-1" onclick="updateQuantity('${name}', 1)">+</button>
                        <button class="btn btn-sm btn-danger" onclick="removeFromCart('${name}')">X</button>
                    </div>
                `;
                cartItemsDiv.appendChild(div);
            }
            totalSpan.textContent = total.toFixed(2);
        }

        function addToCart(name, price) {
            if (cart[name]) {
                cart[name].quantity += 1;
            } else {
                cart[name] = { price: parseFloat(price), quantity: 1 };
            }
            renderCart();
        }

        function updateQuantity(name, delta) {
            if (cart[name]) {
                cart[name].quantity += delta;
                if (cart[name].quantity <= 0) {
                    removeFromCart(name);
                } else {
                    renderCart();
                }
            }
        }

        function removeFromCart(name) {
            delete cart[name];
            renderCart();
        }

        function placeOrder() {
            const statusDiv = document.getElementById('status-message');
            statusDiv.className = 'alert alert-info mt-2';
            statusDiv.textContent = 'Processing order...';
            
            if (Object.keys(cart).length === 0) {
                statusDiv.className = 'alert alert-warning mt-2';
                statusDiv.textContent = 'Error: Cart is empty.';
                return;
            }

            // Simulate successful submission to a backend endpoint
            setTimeout(() => {
                statusDiv.className = 'alert alert-success mt-2';
                statusDiv.textContent = 'Order placed successfully! (Simulated API response)';
                cart = {};
                renderCart();
            }, 1500);
        }

        // Initial render
        renderCart();
    </script>
</body>
</html>
